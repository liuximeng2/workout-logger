[project]
name = "workout-logger"
version = "0.1.0"
description = "CLI tool for workout video exercise classification and rep counting using InternVL3-8B"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.8",
    "numpy>=1.24",
    "Pillow>=10.0",
    "torch>=2.11.0",
    "transformers==4.52.4",
    "bitsandbytes>=0.43",
    "accelerate>=0.27",
    "torchvision>=0.26.0",
    "einops>=0.7",
    "timm>=1.0",
    "huggingface-hub>=0.20",
    "compressed-tensors==0.14.0.1",
]

[project.scripts]
video-reps = "video_reps.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["video_reps"]

[tool.uv]
# Keep wheels and build cache under the repo (default is ~/.cache/uv).
cache-dir = ".uv-cache"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
